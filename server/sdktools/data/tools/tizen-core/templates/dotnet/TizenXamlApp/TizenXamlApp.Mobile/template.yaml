name: TizenXamlApp/TizenXamlApp.Mobile
type: dotnet_app
description: "A mobile project template for building XAML apps with Xamarin.Forms"
icon: ""
shampshot: ""

templates: 
  TizenXamlApp.Mobile/TizenXamlApp.Mobile.csproj: {{project_name}}.Mobile/{{project_name}}.Mobile.csproj
  TizenXamlApp.Mobile/TizenXamlApp.Mobile.cs: {{project_name}}.Mobile/{{project_name}}.Mobile.cs
  TizenXamlApp.Mobile/tizen-manifest.xml: {{project_name}}.Mobile/tizen-manifest.xml
  TizenXamlApp.Mobile/tizen_dotnet_project.yaml: {{project_name}}.Mobile/tizen_dotnet_project.yaml

files:
  TizenXamlApp.Mobile/shared/res/TizenXamlApp.Mobile.png: {{project_name}}.Mobile/shared/res/{{project_name}}.Mobile.png
  
folders:
  - {{project_name}}.Mobile/res
  - {{project_name}}.Mobile/lib

deps: [ {{project_name}}/{{project_name}} ]