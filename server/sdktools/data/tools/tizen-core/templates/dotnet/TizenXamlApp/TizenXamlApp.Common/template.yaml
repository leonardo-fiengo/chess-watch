name: TizenXamlApp/TizenXamlApp.Common
type: dotnet_app
description: "A common project template for building XAML apps with Xamarin.Forms"
icon: ""
shampshot: ""

templates:
  TizenXamlApp.Common/TizenXamlApp.Common.csproj: {{project_name}}.Common/{{project_name}}.Common.csproj
  TizenXamlApp.Common/TizenXamlApp.cs: {{project_name}}.Common/{{project_name}}.Common.cs
  TizenXamlApp.Common/tizen-manifest.xml: {{project_name}}.Common/tizen-manifest.xml
  TizenXamlApp.Common/tizen_dotnet_project.yaml: {{project_name}}.Common/tizen_dotnet_project.yaml

files:
  TizenXamlApp.Common/shared/res/TizenXamlApp.png: {{project_name}}.Common/shared/res/{{project_name}}.Common.png
  
folders:
  - {{project_name}}.Common/res
  - {{project_name}}.Common/lib

deps: [ {{project_name}}/{{project_name}} ]